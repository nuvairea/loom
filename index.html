<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loom - Weave Your Inspiration</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <meta name="theme-color" content="#e2e0f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141118" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <header class="topbar">
      <span class="wordmark">Loom</span>
      <button id="board-switch" class="board-chip" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Switch board">
        <span id="board-name">My weave</span>
        <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
      </button>
      <input type="text" id="board-title" class="board-title hidden" maxlength="40" aria-label="Board title" spellcheck="false" />
      <span id="image-count" class="count" aria-live="polite">0 images</span>
    </header>

    <div class="empty-message"></div>

    <div class="moodboard-masonry"></div>

    <div class="input-wrapper">
      <div class="input-area">
        <button id="upload-btn" class="pill tonal icon" type="button" title="Upload Image" aria-label="Upload image from device">
          <span class="material-symbols-outlined" aria-hidden="true">add_photo_alternate</span>
        </button>

        <input type="text" id="image-url" placeholder="Paste image URL" aria-label="Image URL" />

        <button id="add-btn" class="pill primary" type="button" aria-label="Add image to weave">Add to weave</button>
      </div>
      <div class="tools">
        <button id="export-btn" class="pill secondary icon" type="button" title="Export as PNG" aria-label="Export moodboard as image">
          <span class="material-symbols-outlined" aria-hidden="true">save_alt</span>
        </button>
        <button id="share-btn" class="pill secondary icon" type="button" title="Weave &amp; Share" aria-label="Share moodboard">
          <span class="material-symbols-outlined" aria-hidden="true">ios_share</span>
        </button>
        <button id="clear-btn" class="pill danger icon" type="button" title="Clear weave" aria-label="Clear entire moodboard">
          <span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web-animations/2.3.2/web-animations.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/muuri/0.9.5/muuri.min.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
